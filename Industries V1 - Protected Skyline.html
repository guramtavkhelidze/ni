<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ინდუსტრიები — V1 · Protected Skyline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#07080A; --bg-2:#0C0E12; --panel:#121419;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
    --text:#EEF1F4; --muted:#9AA2AC; --dim:#687078;
    --teal:#36D2E6; --teal-2:#19A6BC;
    --font:'Noto Sans Georgian',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px;}

  .sky-sec{
    position:relative;padding:118px 0 0;overflow:hidden;
    background:
      radial-gradient(90% 80% at 12% 6%, rgba(54,210,230,.12), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
  }
  .eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);display:inline-flex;align-items:center;gap:10px;font-weight:500;}
  .eyebrow::before{content:"";width:26px;height:1px;background:currentColor;opacity:.8;}
  .sec-head{max-width:780px;margin-bottom:18px;}
  .sec-head h2{font-size:clamp(1.9rem,3.6vw,3rem);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin-top:18px;text-wrap:balance;}
  .sec-head p{color:var(--muted);font-size:1.04rem;margin-top:14px;max-width:560px;}

  /* readout above skyline */
  .sky-readout{display:flex;align-items:center;gap:16px;margin:8px 0 0;min-height:34px;font-family:var(--mono);
    font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .sky-readout .sh{display:inline-flex;align-items:center;gap:8px;color:var(--teal);}
  .sky-readout .sh .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sky-readout .nm{color:var(--text);letter-spacing:.04em;font-size:.82rem;}

  /* the city stage */
  .city{position:relative;margin-top:30px;height:430px;}
  /* radar dome arc */
  .dome{position:absolute;left:0;right:0;bottom:64px;height:380px;width:100%;pointer-events:none;overflow:visible;}
  .dome path{fill:none;stroke:rgba(54,210,230,.22);stroke-width:1.5;stroke-dasharray:5 7;}
  .dome .fill{fill:url(#domeg);stroke:none;opacity:.5;}
  /* sweep */
  .sweep{position:absolute;top:0;bottom:64px;width:160px;left:-160px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(54,210,230,.16) 60%,rgba(54,210,230,.42));
    border-right:1.5px solid rgba(54,210,230,.6);mix-blend-mode:screen;
    animation:sweepGo 6s linear infinite;}
  @keyframes sweepGo{0%{left:-12%;}100%{left:104%;}}

  .ground{position:absolute;left:0;right:0;bottom:63px;height:1px;background:linear-gradient(90deg,transparent,rgba(54,210,230,.5),transparent);}
  .ground::after{content:"";position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(180deg,rgba(54,210,230,.05),transparent);}

  .skyline{position:absolute;left:0;right:0;bottom:64px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.1vw,16px);height:360px;}
  .tower{position:relative;flex:1 1 0;min-width:0;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;
    transform:translateY(18px) scaleY(.94);transform-origin:bottom;opacity:0;
    transition:transform .55s var(--ease),opacity .55s var(--ease),filter .3s;}
  .city.in .tower{transform:translateY(0) scaleY(1);opacity:1;}
  /* beacon */
  .tower .beacon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:10px;
    background:rgba(54,210,230,.1);border:1px solid rgba(54,210,230,.3);color:var(--teal);
    transition:all .3s var(--ease);z-index:3;}
  .tower .beacon svg{width:19px;height:19px;}
  /* building body */
  .tower .body{position:relative;width:100%;border:1px solid var(--line-2);border-bottom:none;
    border-radius:5px 5px 0 0;overflow:hidden;
    background:linear-gradient(180deg,rgba(20,24,30,.9),rgba(12,14,18,.7));
    transition:border-color .3s,background .3s,box-shadow .3s;}
  /* window grid */
  .tower .body::before{content:"";position:absolute;inset:8px;
    background-image:linear-gradient(90deg,rgba(54,210,230,.16) 1px,transparent 1px),linear-gradient(rgba(54,210,230,.16) 1px,transparent 1px);
    background-size:12px 14px;opacity:.5;transition:opacity .3s;}
  .tower .body::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(54,210,230,.18),transparent 70%);opacity:0;transition:opacity .35s;}
  /* label */
  .tower .lab{position:absolute;bottom:calc(100% + 52px);left:50%;transform:translate(-50%,8px);
    white-space:nowrap;font-size:.78rem;font-weight:600;letter-spacing:-.01em;color:var(--text);
    background:rgba(8,12,14,.92);border:1px solid rgba(54,210,230,.4);padding:6px 11px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:5;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.7);}
  .tower .lab::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(54,210,230,.4);}
  /* hover/active */
  .tower:hover,.tower.active{transform:translateY(-10px) scaleY(1);filter:drop-shadow(0 18px 30px rgba(54,210,230,.25));}
  .tower:hover .beacon,.tower.active .beacon{background:var(--teal);color:#04181c;border-color:var(--teal);box-shadow:0 0 22px rgba(54,210,230,.8);transform:scale(1.12);}
  .tower:hover .body,.tower.active .body{border-color:rgba(54,210,230,.55);box-shadow:inset 0 0 30px rgba(54,210,230,.12);}
  .tower:hover .body::before,.tower.active .body::before{opacity:1;}
  .tower:hover .body::after,.tower.active .body::after{opacity:1;}
  .tower:hover .lab,.tower.active .lab{opacity:1;transform:translate(-50%,0);}
  /* antenna for tall ones */
  .tower .ant{position:absolute;top:-12px;width:1.5px;height:12px;background:rgba(54,210,230,.5);}
  .tower .ant::after{content:"";position:absolute;top:-3px;left:-1.5px;width:4.5px;height:4.5px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);}

  .city-base{position:absolute;left:0;right:0;bottom:0;height:64px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 26px),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    border-top:1px solid var(--line);}
  .city-base .meta{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px;
    font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .reveal.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.sweep,.sky-readout .sh .dot{animation:none !important;}.reveal{opacity:1!important;transform:none!important;}.tower{opacity:1!important;transform:none!important;}}
  @media(max-width:760px){
    .tower .beacon{width:26px;height:26px;}.tower .beacon svg{width:14px;height:14px;}
    .tower .lab{font-size:.66rem;}
  }
  @media(max-width:620px){
    .sky-sec{padding:74px 0 0;}
    .wrap{padding:0 16px;}
    .sec-head p{font-size:.94rem;}
    .sky-readout{gap:10px;flex-wrap:wrap;font-size:.66rem;}
    .sky-readout .nm{font-size:.74rem;}
    .city{height:360px;margin-top:22px;}
    .dome{height:320px;}
    .skyline{height:300px;gap:5px;}
    /* edge tower tooltips would clip off-screen — rely on the readout instead */
    .tower .lab{display:none;}
    .tower .beacon{width:23px;height:23px;margin-bottom:7px;}
    .tower .beacon svg{width:13px;height:13px;}
    .city-base .meta{font-size:.58rem;letter-spacing:.1em;}
  }
</style>
</head>
<body>
  <section class="sky-sec" id="sky">
    <div class="wrap">
      <div class="sec-head reveal">
        <div class="eyebrow">ინდუსტრიები</div>
        <h2>ინდუსტრიები, რომლებსაც ვიცავთ</h2>
        <p>თითოეული სექტორი ჩვენი დაცვის გუმბათის ქვეშ. გადაატარეთ კურსორი ნაგებობას.</p>
      </div>
      <div class="sky-readout reveal" data-delay="1">
        <span class="sh"><span class="dot"></span>PERIMETER SECURE</span>
        <span>·</span>
        <span class="nm" id="ro-name">10 SECTORS PROTECTED</span>
      </div>

      <div class="city" id="city">
        <svg class="dome" viewBox="0 0 1000 380" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="domeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36D2E6" stop-opacity=".10"/><stop offset="1" stop-color="#36D2E6" stop-opacity="0"/></linearGradient></defs>
          <path class="fill" d="M0 380 Q500 -120 1000 380 Z"/>
          <path d="M0 380 Q500 -120 1000 380"/>
        </svg>
        <div class="sweep"></div>
        <div class="skyline" id="skyline"></div>
        <div class="ground"></div>
        <div class="city-base">
          <div class="meta"><span>CYBERX · SECTOR GRID</span><span id="ro-sector">— SCANNING</span></div>
        </div>
      </div>
    </div>
  </section>

<script>
const ic={
  smb:'<path d="M4 20V9l5-3 5 3v11M14 20v-7h5v7M3 20h18M8 12h2M8 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  bank:'<path d="M4 10h16M6 10v8M10 10v8M14 10v8M18 10v8M3 20h18M12 3 4 7h16l-8-4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  gov:'<path d="M5 21V9l7-5 7 5v12M9 21v-6h6v6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  telecom:'<path d="M12 20V8M8 11a5.7 5.7 0 0 1 8 0M5 8a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  energy:'<path d="M13 3 5 13h6l-1 8 8-11h-6l1-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  mfg:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  retail:'<path d="M6 8h12l1 12H5L6 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.6"/>',
  edu:'<path d="M12 4 3 8l9 4 9-4-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 11v4c0 1.5 2.2 2.5 5 2.5s5-1 5-2.5v-4" stroke="currentColor" stroke-width="1.6"/>',
  logistics:'<path d="M3 16V8h11v8M14 11h4l3 3v2h-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7" cy="17" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="2" stroke="currentColor" stroke-width="1.6"/>',
  gaming:'<rect x="3" y="7" width="18" height="10" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7 11v2M6 12h2M15 11.5h.01M17.5 13.5h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'
};
// h = relative tower height 0..1 ; ant = antenna flag
const DATA=[
  {n:'SMB ბიზნესი',full:'SMB ბიზნეს გადაწყვეტილებები',i:'smb',h:.52},
  {n:'ბანკები / ფინანსები',full:'ბანკები და ფინანსური სექტორი',i:'bank',h:.92,ant:1},
  {n:'სახელმწიფო სექტორი',full:'სახელმწიფო სექტორი',i:'gov',h:.7},
  {n:'ტელეკომი',full:'ტელეკომი',i:'telecom',h:1,ant:1},
  {n:'ენერგეტიკა',full:'ენერგეტიკა',i:'energy',h:.8},
  {n:'წარმოება',full:'წარმოება',i:'mfg',h:.6},
  {n:'Retail',full:'Retail',i:'retail',h:.48},
  {n:'განათლება',full:'განათლება',i:'edu',h:.66},
  {n:'ტრანსპორტი / ლოგისტიკა',full:'ტრანსპორტი და ლოგისტიკა',i:'logistics',h:.74},
  {n:'Gaming & Casinos',full:'Gaming & Casinos',i:'gaming',h:.86,ant:1}
];
const svg=p=>'<svg viewBox="0 0 24 24" fill="none">'+p+'</svg>';
const _mob=window.matchMedia('(max-width:620px)').matches;
const minH=_mob?78:120,maxH=_mob?244:300;
const skyline=document.getElementById('skyline');
skyline.innerHTML=DATA.map((d,i)=>{
  const bh=Math.round(minH+(maxH-minH)*d.h);
  return `<div class="tower" data-i="${i}" style="transition-delay:${i*0.06}s">
    <span class="lab">${d.full}</span>
    ${d.ant?'<span class="ant"></span>':''}
    <span class="beacon">${svg(ic[d.i])}</span>
    <span class="body" style="height:${bh}px"></span>
  </div>`;
}).join('');

const roName=document.getElementById('ro-name');
const roSector=document.getElementById('ro-sector');
const towers=[...skyline.querySelectorAll('.tower')];
function activate(i){
  towers.forEach((t,k)=>t.classList.toggle('active',k===i));
  roName.textContent=DATA[i].full;
  roSector.textContent='— SECTOR '+String(i+1).padStart(2,'0')+' SECURED';
}
function clearAct(){
  towers.forEach(t=>t.classList.remove('active'));
  roName.textContent='10 SECTORS PROTECTED';
  roSector.textContent='— SCANNING';
}
towers.forEach((t,i)=>{
  t.addEventListener('mouseenter',()=>{stopAuto();activate(i);});
  t.addEventListener('click',()=>{stopAuto();activate(i);});
});
document.getElementById('city').addEventListener('mouseleave',()=>{if(!auto)clearAct();});

let auto=null,ai=0;
function startAuto(){if(auto)return;auto=setInterval(()=>{activate(ai);ai=(ai+1)%DATA.length;},2400);}
function stopAuto(){if(auto){clearInterval(auto);auto=null;}}

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');
    if(e.target.id==='city'){setTimeout(startAuto,1200);}
    io.unobserve(e.target);}
}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
io.observe(document.getElementById('city'));
// fallback for embedded/iframe contexts where IO may not fire
setTimeout(()=>{document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));const c=document.getElementById('city');c.classList.add('in');startAuto();const s=document.createElement('style');s.textContent='.reveal{opacity:1!important;transform:none!important;transition:none!important}.city.in .tower,.tower{opacity:1!important;transform:none!important}';document.head.appendChild(s);},1200);
</script>
</body>
</html>
