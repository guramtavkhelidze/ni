<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ინდუსტრიები — V2 · Signal Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#07080A; --bg-2:#0C0E12; --panel:#121419;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
    --text:#EEF1F4; --muted:#9AA2AC; --dim:#687078;
    --teal:#36D2E6; --teal-2:#19A6BC; --green:#25E08A;
    --font:'Noto Sans Georgian',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px;}

  .lanes-sec{
    position:relative;padding:118px 0 124px;
    background:
      radial-gradient(80% 70% at 88% 6%, rgba(54,210,230,.12), transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
  }
  .eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);display:inline-flex;align-items:center;gap:10px;font-weight:500;}
  .eyebrow::before{content:"";width:26px;height:1px;background:currentColor;opacity:.8;}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px;flex-wrap:wrap;}
  .sec-head h2{font-size:clamp(1.9rem,3.6vw,3rem);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin-top:18px;text-wrap:balance;max-width:620px;}
  .legend{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px;}
  .legend .g{display:inline-flex;align-items:center;gap:7px;color:var(--green);}
  .legend .g .d{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}

  /* lanes */
  .lanes{border-top:1px solid var(--line);}
  .lane{
    position:relative;display:grid;grid-template-columns:46px 264px 1fr auto;align-items:center;gap:20px;
    padding:0 14px;height:74px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;
    transition:height .45s var(--ease),background .35s var(--ease);
  }
  .lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--teal);transform:scaleY(0);transform-origin:top;transition:transform .4s var(--ease);}
  .lane:hover,.lane.active{height:104px;background:linear-gradient(90deg,rgba(54,210,230,.06),transparent 70%);}
  .lane:hover::before,.lane.active::before{transform:scaleY(1);}

  .lane .num{font-family:var(--mono);font-size:.82rem;color:var(--dim);letter-spacing:.04em;transition:color .3s;}
  .lane:hover .num,.lane.active .num{color:var(--teal);}

  .lane .id{display:flex;align-items:center;gap:13px;min-width:0;}
  .lane .id .ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
    background:rgba(54,210,230,.1);border:1px solid rgba(54,210,230,.22);color:var(--teal);transition:all .3s var(--ease);}
  .lane .id .ic svg{width:19px;height:19px;}
  .lane:hover .id .ic,.lane.active .id .ic{background:var(--teal);color:#04181c;border-color:var(--teal);box-shadow:0 0 18px rgba(54,210,230,.55);transform:scale(1.06);}
  .lane .id .nm{font-size:1.06rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--muted);transition:color .3s;}
  .lane:hover .id .nm,.lane.active .id .nm{color:var(--text);}

  /* the live signal stream */
  .stream{position:relative;height:40px;min-width:0;}
  .stream svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .stream .base{stroke:rgba(255,255,255,.08);stroke-width:1.5;fill:none;}
  .stream .wave{stroke:var(--teal);stroke-width:1.8;fill:none;stroke-linecap:round;
    stroke-dasharray:7 9;stroke-dashoffset:0;opacity:.5;transition:opacity .3s,stroke-width .3s;
    animation:flow 1.4s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-32;}}
  .lane:hover .stream .wave,.lane.active .stream .wave{opacity:1;stroke-width:2.2;animation-duration:.7s;}
  .stream .pkt{fill:var(--teal);opacity:0;}
  .lane:hover .stream .pkt,.lane.active .stream .pkt{opacity:1;animation:pkt 1.5s linear infinite;}
  @keyframes pkt{0%{transform:translateX(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateX(var(--tx,300px));opacity:0;}}

  /* status pill */
  .lane .stat{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;transition:color .3s;}
  .lane .stat .d{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:all .3s;}
  .lane:hover .stat,.lane.active .stat{color:var(--green);}
  .lane:hover .stat .d,.lane.active .stat .d{background:var(--green);box-shadow:0 0 9px var(--green);}
  .lane .stat .cnt{color:var(--text);font-variant-numeric:tabular-nums;min-width:48px;text-align:right;}

  /* expanding detail under name */
  .lane .desc{grid-column:2 / -1;font-size:.92rem;color:var(--muted);line-height:1.4;max-width:680px;
    max-height:0;opacity:0;overflow:hidden;transition:max-height .45s var(--ease),opacity .35s var(--ease),margin .45s;}
  .lane:hover .desc,.lane.active .desc{max-height:40px;opacity:1;margin-top:6px;}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
  .reveal.in{opacity:1;transform:none;}
  .lane.reveal{transform:translateX(-16px);}
  .lane.reveal.in{transform:none;}
  @media(prefers-reduced-motion:reduce){.stream .wave,.stream .pkt{animation:none !important;}.reveal{opacity:1!important;transform:none!important;}}
  @media(max-width:900px){
    .lane{grid-template-columns:38px 1fr auto;gap:14px;}
    .stream{display:none;}
    .lane .desc{grid-column:2 / -1;}
  }
  @media(max-width:640px){
    .lanes-sec{padding:74px 0 80px;}
    .wrap{padding:0 16px;}
    .sec-head{margin-bottom:22px;gap:10px;}
    .legend{font-size:.64rem;gap:7px;}
    .lane{height:auto;min-height:64px;padding:13px 6px;gap:12px;}
    .lane:hover,.lane.active{height:auto;}
    .lane .id .ic{width:30px;height:30px;}
    .lane .id .ic svg{width:17px;height:17px;}
    .lane .id .nm{font-size:.95rem;}
    .lane .stat .cnt{display:none;}
    .lane .desc{font-size:.9rem;}
    .lane:hover .desc,.lane.active .desc{max-height:84px;}
  }
</style>
</head>
<body>
  <section class="lanes-sec">
    <div class="wrap">
      <div class="sec-head reveal">
        <div>
          <div class="eyebrow">ინდუსტრიები</div>
          <h2>ინდუსტრიები, რომლებსაც ვიცავთ</h2>
        </div>
        <div class="legend"><span class="g"><span class="d"></span>LIVE TRAFFIC</span><span>· 10 SECTORS · 24/7</span></div>
      </div>

      <div class="lanes" id="lanes"></div>
    </div>
  </section>

<script>
const ic={
  smb:'<path d="M4 20V9l5-3 5 3v11M14 20v-7h5v7M3 20h18M8 12h2M8 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
  bank:'<path d="M4 10h16M6 10v8M10 10v8M14 10v8M18 10v8M3 20h18M12 3 4 7h16l-8-4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  gov:'<path d="M5 21V9l7-5 7 5v12M9 21v-6h6v6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  telecom:'<path d="M12 20V8M8 11a5.7 5.7 0 0 1 8 0M5 8a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  energy:'<path d="M13 3 5 13h6l-1 8 8-11h-6l1-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  mfg:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  retail:'<path d="M6 8h12l1 12H5L6 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.6"/>',
  edu:'<path d="M12 4 3 8l9 4 9-4-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 11v4c0 1.5 2.2 2.5 5 2.5s5-1 5-2.5v-4" stroke="currentColor" stroke-width="1.6"/>',
  logistics:'<path d="M3 16V8h11v8M14 11h4l3 3v2h-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7" cy="17" r="2" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="2" stroke="currentColor" stroke-width="1.6"/>',
  gaming:'<rect x="3" y="7" width="18" height="10" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7 11v2M6 12h2M15 11.5h.01M17.5 13.5h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>'
};
const DATA=[
  {full:'SMB ბიზნეს გადაწყვეტილებები',i:'smb',d:'მცირე და საშუალო ბიზნესის მორგებული, ხელმისაწვდომი დაცვის გადაწყვეტილებები.'},
  {full:'ბანკები და ფინანსური სექტორი',i:'bank',d:'მარეგულირებელ მოთხოვნებთან შესაბამისობა და ტრანზაქციების მაღალი დონის დაცვა.'},
  {full:'სახელმწიფო სექტორი',i:'gov',d:'კრიტიკული სახელმწიფო სერვისებისა და მოქალაქეთა მონაცემების დაცვა.'},
  {full:'ტელეკომი',i:'telecom',d:'ქსელის ინფრასტრუქტურისა და აბონენტთა მონაცემების ფართომასშტაბიანი დაცვა.'},
  {full:'ენერგეტიკა',i:'energy',d:'კრიტიკული ენერგო-ინფრასტრუქტურისა და OT სისტემების დაცვა.'},
  {full:'წარმოება',i:'mfg',d:'საწარმოო პროცესების, ICS და მიწოდების ჯაჭვის უსაფრთხოება.'},
  {full:'Retail',i:'retail',d:'გადახდის სისტემებისა და მომხმარებელთა მონაცემების დაცვა.'},
  {full:'განათლება',i:'edu',d:'სასწავლო დაწესებულებების ქსელებისა და კვლევითი მონაცემების დაცვა.'},
  {full:'ტრანსპორტი და ლოგისტიკა',i:'logistics',d:'მიწოდების ჯაჭვის, ფლოტისა და ოპერაციული სისტემების უსაფრთხოება.'},
  {full:'Gaming & Casinos',i:'gaming',d:'მაღალი დატვირთვის პლატფორმებისა და ფინანსური ნაკადების დაცვა.'}
];
const svg=p=>'<svg viewBox="0 0 24 24" fill="none">'+p+'</svg>';
// generate a gentle pseudo-random wave path
function wavePath(seed){
  let p='M0 20',x=0;const step=22;
  for(let i=0;i<14;i++){x+=step;const y=20+Math.sin((i+seed)*1.1)*9+Math.cos((i*1.7+seed))*4;p+=` L${x} ${y.toFixed(1)}`;}
  return p;
}
const lanes=document.getElementById('lanes');
lanes.innerHTML=DATA.map((d,i)=>`
  <div class="lane reveal" data-i="${i}" style="transition-delay:${i*0.05}s">
    <span class="num">${String(i+1).padStart(2,'0')}</span>
    <span class="id"><span class="ic">${svg(ic[d.i])}</span><span class="nm">${d.full}</span></span>
    <span class="stream">
      <svg viewBox="0 0 300 40" preserveAspectRatio="none">
        <path class="base" d="${wavePath(i+9)}"/>
        <path class="wave" d="${wavePath(i)}"/>
        <circle class="pkt" cx="0" cy="20" r="3" style="--tx:300px"/>
      </svg>
    </span>
    <span class="stat"><span class="d"></span><span>SECURED</span><span class="cnt" data-i="${i}">0</span></span>
    <span class="desc">${d.d}</span>
  </div>`).join('');

// animate "blocked" counters when in view
const counters=[...lanes.querySelectorAll('.cnt')];
let _counted=false;
function runCounters(){
  if(_counted)return;_counted=true;
  counters.forEach((c,i)=>{
    const target=2400+Math.floor(Math.random()*9000);
    const t0=performance.now(),dur=1400+i*60;
    (function tick(){
      const p=Math.min((performance.now()-t0)/dur,1);
      c.textContent=Math.round(target*(1-Math.pow(1-p,3))).toLocaleString();
      if(p<1)requestAnimationFrame(tick);
    })();
  });
}

const laneEls=[...lanes.querySelectorAll('.lane')];
function setActive(i){laneEls.forEach((x,k)=>x.classList.toggle('active',k===i));}
laneEls.forEach((l,i)=>{
  l.addEventListener('mouseenter',()=>{stopCycle();setActive(i);});
  l.addEventListener('click',()=>{stopCycle();l.classList.toggle('active');laneEls.forEach((x,k)=>{if(k!==i)x.classList.remove('active');});});
});
lanes.addEventListener('mouseleave',()=>{if(!cyc)laneEls.forEach(x=>x.classList.remove('active'));});

// touch devices: auto-walk the lanes so the live waves + details reveal themselves
let cyc=null;
if(window.matchMedia('(hover:none)').matches){
  let ci=0;
  cyc=setInterval(()=>{setActive(ci%laneEls.length);ci++;},2400);
}
function stopCycle(){if(cyc){clearInterval(cyc);cyc=null;}}

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');
    if(e.target.id==='lanes')runCounters();
    io.unobserve(e.target);}
}),{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
io.observe(lanes);
// fallback for embedded/iframe contexts where IO may not fire
setTimeout(()=>{document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));runCounters();const s=document.createElement('style');s.textContent='.reveal{opacity:1!important;transform:none!important;transition:none!important}';document.head.appendChild(s);},1100);
</script>
</body>
</html>
