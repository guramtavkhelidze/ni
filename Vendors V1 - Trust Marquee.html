<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ტექნოლოგიური ვენდორები — V1 · Trust Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#07080A; --bg-2:#0C0E12; --panel:#121419; --panel-2:#171A20;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --text:#EEF1F4; --muted:#9AA2AC; --dim:#687078;
    --brand:#FF4B26; --brand-2:#FF7A3C;
    --font:'Noto Sans Georgian',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px;}

  .vsec{position:relative;padding:118px 0;overflow:hidden;
    background:radial-gradient(60% 60% at 50% -10%, rgba(255,75,38,.10), transparent 60%), linear-gradient(180deg,var(--bg),var(--bg-2));}
  .vsec::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(75% 70% at 50% 30%,#000,transparent 95%);pointer-events:none;}
  .vsec .wrap{position:relative;z-index:2;}

  .head{text-align:center;max-width:760px;margin:0 auto 56px;}
  .eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-2);display:inline-flex;align-items:center;gap:10px;font-weight:500;}
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:currentColor;opacity:.7;}
  .head p{color:var(--muted);font-size:1.1rem;line-height:1.6;margin-top:20px;}
  .count{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .count b{color:var(--text);font-weight:600;}
  .count .pulse{width:8px;height:8px;border-radius:50%;background:#25E08A;box-shadow:0 0 10px #25E08A;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .rows{display:flex;flex-direction:column;gap:18px;}
  .row{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);}
  .track{display:flex;gap:18px;width:max-content;animation:scroll 42s linear infinite;}
  .row.rev .track{animation-duration:52s;animation-direction:reverse;}
  .row:hover .track{animation-play-state:paused;}
  @keyframes scroll{to{transform:translateX(-50%);}}

  .plate{flex-shrink:0;height:84px;padding:0 26px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .3s,box-shadow .3s,transform .3s var(--ease);}
  .plate.light{border-color:rgba(255,255,255,.16);}
  .plate img{height:52px;width:auto;display:block;}
  .plate .wm{font-size:1.3rem;font-weight:800;letter-spacing:-.015em;color:#fff;white-space:nowrap;}
  .plate:hover{transform:translateY(-4px);border-color:rgba(255,75,38,.55);box-shadow:0 22px 50px -26px rgba(255,75,38,.6);}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .reveal.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.track{animation:none !important;}.count .pulse{animation:none !important;}.reveal{opacity:1!important;transform:none!important;}}
  @media(max-width:620px){
    .vsec{padding:74px 0;}.wrap{padding:0 16px;}
    .head{margin-bottom:38px;}.head p{font-size:.96rem;}
    .plate{height:64px;padding:0 18px;}
    .plate img{height:40px;}
    .plate .wm{font-size:1.06rem;}
    .rows{gap:14px;}.track{gap:14px;}
  }
</style>
</head>
<body>
  <section class="vsec">
    <div class="wrap">
      <div class="head reveal">
        <div class="eyebrow">ტექნოლოგიური ვენდორები</div>
        <p>ვთანამშრომლობთ მსოფლიო დონის კიბერუსაფრთხოების ვენდორებთან, რათა ორგანიზაციებს მივაწოდოთ სანდო, Enterprise კლასის უსაფრთხოების გადაწყვეტილებები.</p>
        <span class="count"><span class="pulse"></span>აქტიური პარტნიორობა · <b>9 ვენდორი</b></span>
      </div>
      <div class="rows reveal" data-delay="1">
        <div class="row"><div class="track" id="rowA"></div></div>
        <div class="row rev"><div class="track" id="rowB"></div></div>
      </div>
    </div>
  </section>

<script>
  const LOGO='../vendor-logos/';
  const VENDORS=[
    {n:'Fortra',file:'fortra.png',bg:'#006a56',light:false},
    {n:'Nozomi Networks',file:'nozomi.png',bg:'#ffffff',light:true},
    {n:'OPSWAT',file:'opswat.png',bg:'#050f22',light:false},
    {n:'Secure Code Warrior',file:'secure-code-warrior.png',bg:'#1c4db5',light:false},
    {n:'42Gears',file:'',bg:'#10131a',light:false},
    {n:'Palo Alto Networks',file:'palo-alto.png',bg:'#040607',light:false},
    {n:'SentinelOne',file:'sentinelone.png',bg:'#ffffff',light:true},
    {n:'CyberArk',file:'cyberark.png',bg:'#ffffff',light:true},
    {n:'Energy Logserver',file:'energy-logserver.png',bg:'#000000',light:false}
  ];
  const cell=v=>`<div class="plate${v.light?' light':''}" style="background:${v.bg}">${v.file?`<img src="${LOGO}${v.file}" alt="${v.n}">`:`<span class="wm">${v.n}</span>`}</div>`;
  // duplicate the set so the -50% translate loops seamlessly
  const setA=VENDORS.map(cell).join('');
  const half=Math.ceil(VENDORS.length/2);
  const a=[...VENDORS.slice(0,half),...VENDORS.slice(0,half)];
  const b=[...VENDORS.slice(half),...VENDORS.slice(0,2),...VENDORS.slice(half),...VENDORS.slice(0,2)];
  document.getElementById('rowA').innerHTML=a.map(cell).join('');
  document.getElementById('rowB').innerHTML=b.map(cell).join('');

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  setTimeout(()=>{document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));var s=document.createElement('style');s.textContent='.reveal{opacity:1!important;transform:none!important;transition:none!important}';document.head.appendChild(s);},700);
</script>
</body>
</html>
